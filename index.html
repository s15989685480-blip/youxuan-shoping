<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AURUM 臻选 · 奢华精品百货</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0B10'/%3E%3Cpath d='M32 12 L50 52 L32 43 L14 52 Z' fill='%23C8A96A'/%3E%3Ccircle cx='32' cy='12' r='3' fill='%23EAD9AC'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#0B0B10; --bg2:#12121A; --bg3:#1A1A26; --bg4:#22222F;
  --gold:#C8A96A; --gold2:#EAD9AC; --gold3:#8E7235;
  --ink:#F2EDE4; --muted:#94949F; --muted2:#5E5E6A;
  --line:rgba(200,169,106,.18); --line2:rgba(200,169,106,.45);
  --ok:#63C797; --bad:#C96464; --warn:#D08A5A;
  --serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --nav-h:68px; --filing-h:34px; --tab-h:60px;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  line-height:1.6; min-height:100vh; overflow-x:hidden;
  padding-bottom:calc(var(--filing-h) + 40px);
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(900px 420px at 50% -8%, rgba(200,169,106,.10), transparent 62%),
    radial-gradient(700px 500px at 100% 110%, rgba(200,169,106,.05), transparent 60%),
    var(--bg);
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
::selection{background:rgba(200,169,106,.35)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2A2A38;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 版式 ============ */
.serif{font-family:var(--serif)}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.sec-title{font-family:var(--serif);font-weight:700;font-size:28px;letter-spacing:.06em;display:flex;align-items:center;gap:16px;margin:0 0 22px}
.sec-title::before,.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.sec-title .en{font-size:13px;color:var(--gold3);letter-spacing:.3em;font-weight:500;flex:none}
.gold-text{background:linear-gradient(100deg,#EAD9AC 10%,#C8A96A 50%,#9A7B3F 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:60;height:var(--nav-h);
  background:rgba(11,11,16,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{height:100%;display:flex;align-items:center;gap:26px}
.logo{display:flex;align-items:center;gap:11px;flex:none;cursor:pointer;min-height:44px}
.logo-mark{width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#1D1D29,#0D0D13)}
.logo-name{font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.14em;line-height:1.1}
.logo-sub{font-size:10px;color:var(--gold3);letter-spacing:.42em;font-weight:500}
.nav-links{display:flex;gap:26px;margin-left:8px}
.nav-links a{font-size:14.5px;color:var(--muted);letter-spacing:.12em;padding:6px 2px;position:relative;transition:color .25s}
.nav-links a:hover,.nav-links a.active{color:var(--gold2)}
.nav-links a.active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.top-search{flex:1;max-width:300px;margin-left:auto;position:relative}
.top-search input{
  width:100%;height:38px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);padding:0 40px 0 18px;font-size:13.5px;color:var(--ink);
  transition:border-color .25s;outline:none;
}
.top-search input:focus{border-color:var(--line2)}
.top-search .s-ico{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;
  border:1px solid transparent;transition:all .25s;color:var(--ink);
}
.icon-btn:hover{background:rgba(200,169,106,.10);border-color:var(--line);color:var(--gold2)}
.icon-btn .badge{
  position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:linear-gradient(135deg,#E0BE77,#B8914A);color:#131013;font-size:11px;font-weight:700;
  display:grid;place-items:center;border:2px solid var(--bg);
}
.hidden{display:none !important}

/* ============ 视图容器 ============ */
.view{display:none;animation:fadeUp .45s ease}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page-head{margin:34px 0 24px}
.page-head h1{font-family:var(--serif);font-weight:900;font-size:32px;letter-spacing:.08em}
.page-head p{color:var(--muted);font-size:14px;margin-top:6px}

/* ============ 首页 ============ */
.hero{
  position:relative;border-radius:24px;overflow:hidden;margin-top:24px;
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.hero img{width:100%;height:440px;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,16,.10) 0%,rgba(11,11,16,.45) 45%,rgba(11,11,16,.92) 100%)}
.hero-copy{position:absolute;left:6%;right:6%;bottom:0;padding:0 0 44px;z-index:2}
.hero-kicker{font-size:12px;letter-spacing:.5em;color:var(--gold2);margin-bottom:12px}
.hero-title{font-family:var(--serif);font-weight:900;font-size:46px;line-height:1.25;letter-spacing:.08em}
.hero-sub{color:#D8D4C8;font-size:15px;margin-top:10px;max-width:560px;font-weight:300}
.hero-cta{display:flex;gap:14px;margin-top:24px}
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;border-radius:999px;
  font-size:14.5px;font-weight:500;letter-spacing:.08em;padding:13px 30px;transition:all .25s;
}
.btn-gold{background:linear-gradient(135deg,#E0BE77,#B8914A 70%);color:#14100A;box-shadow:0 10px 26px rgba(200,169,106,.25)}
.btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{border:1px solid var(--line2);color:var(--gold2);background:rgba(200,169,106,.05)}
.btn-ghost:hover{background:rgba(200,169,106,.14)}
.btn-block{width:100%}
.btn-sm{padding:9px 20px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.cat-strip{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 8px}
.chip{
  padding:11px 20px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
  font-size:13.5px;letter-spacing:.08em;transition:all .25s;background:rgba(255,255,255,.02);
}
.chip:hover{color:var(--gold2);border-color:var(--line2)}
.chip.on{background:linear-gradient(135deg,#E0BE77,#B8914A);color:#14100A;border-color:transparent;font-weight:600}

.grid-products{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:8px}
.p-card{
  background:linear-gradient(180deg,#15151F,#101018);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .3s,border-color .3s,box-shadow .3s;position:relative;
}
.p-card:hover{transform:translateY(-6px);border-color:var(--line2);box-shadow:var(--shadow)}
.p-media{position:relative;aspect-ratio:1/1;overflow:hidden;background:#0D0D13}
.p-media img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.p-card:hover .p-media img{transform:scale(1.06)}
.p-badge{
  position:absolute;top:14px;left:14px;z-index:2;padding:5px 13px;border-radius:999px;
  background:rgba(11,11,16,.72);backdrop-filter:blur(6px);border:1px solid var(--line2);
  color:var(--gold2);font-size:11px;letter-spacing:.22em;
}
.p-quick{
  position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#E0BE77,#B8914A);color:#14100A;display:grid;place-items:center;
  opacity:0;transform:translateY(8px);transition:all .3s;box-shadow:0 8px 20px rgba(0,0,0,.4);
}
.p-card:hover .p-quick{opacity:1;transform:none}
.p-body{padding:16px 18px 20px}
.p-cat{font-size:11px;letter-spacing:.26em;color:var(--gold3);margin-bottom:6px}
.p-name{font-family:var(--serif);font-weight:700;font-size:17.5px;letter-spacing:.04em;margin-bottom:10px}
.p-meta{display:flex;align-items:baseline;justify-content:space-between}
.p-price{font-family:var(--serif);font-weight:900;font-size:20px;color:var(--gold2)}
.p-price small{font-size:12px;font-weight:600;color:var(--gold);margin-right:2px}
.p-flag{font-size:11px;color:var(--muted)}

.strip-service{
  display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:52px 0;
}
.svc{
  display:flex;gap:14px;align-items:center;padding:20px 22px;border:1px solid var(--line);
  border-radius:var(--radius);background:linear-gradient(180deg,#13131C,#0F0F17);
}
.svc-ico{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--gold2);background:radial-gradient(circle at 30% 25%,#1C1C29,#101018)}
.svc b{font-family:var(--serif);font-size:15px;letter-spacing:.06em;font-weight:700}
.svc span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

.brand-strip{
  margin:10px 0 20px;border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative;
  background:radial-gradient(700px 300px at 20% 0%, rgba(200,169,106,.10), transparent 60%),linear-gradient(180deg,#12121B,#0E0E16);
  padding:44px 48px;
}
.brand-strip h3{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.1em}
.brand-strip p{color:var(--muted);font-size:14px;max-width:680px;margin-top:12px;font-weight:300}
.brand-strip .brand-tag{font-size:11px;letter-spacing:.4em;color:var(--gold3);margin-bottom:10px}

/* ============ 商品详情 ============ */
.detail-wrap{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:44px;margin-top:20px}
.detail-media{position:sticky;top:calc(var(--nav-h) + 22px);border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.detail-media img{width:100%;aspect-ratio:1/1;object-fit:cover}
.detail-info h1{font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:.06em;line-height:1.4}
.detail-cat{font-size:11.5px;letter-spacing:.3em;color:var(--gold3);margin:14px 0 8px}
.detail-price{font-family:var(--serif);font-weight:900;font-size:34px;color:var(--gold2);margin:14px 0 4px}
.detail-price small{font-size:16px;color:var(--gold);margin-right:3px}
.detail-desc{color:var(--muted);font-size:14.5px;margin:14px 0 22px;font-weight:300;max-width:560px}
.spec-list{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;margin-bottom:22px}
.spec-row{display:flex;justify-content:space-between;padding:11px 2px;font-size:14px;border-bottom:1px dashed rgba(200,169,106,.14)}
.spec-row:last-child{border-bottom:none}
.spec-row span:first-child{color:var(--muted)}
.qty-row{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.qty-label{color:var(--muted);font-size:14px}
.qty-box{display:flex;align-items:center;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.qty-box button{width:38px;height:38px;display:grid;place-items:center;color:var(--gold2);transition:background .2s}
.qty-box button:hover{background:rgba(200,169,106,.12)}
.qty-box b{min-width:44px;text-align:center;font-size:15px}
.detail-cta{display:flex;gap:14px}
.detail-cta .btn{flex:1;padding:16px 20px}

/* ============ 购物车 / 结算 ============ */
.cart-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;align-items:start}
.cart-item{display:grid;grid-template-columns:112px 1fr auto;gap:18px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#13131C,#0F0F17);margin-bottom:14px}
.cart-item img{width:112px;height:112px;object-fit:cover;border-radius:12px}
.ci-name{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.04em}
.ci-cat{font-size:11px;color:var(--gold3);letter-spacing:.2em;margin:4px 0 10px}
.ci-price{font-family:var(--serif);color:var(--gold2);font-weight:700;font-size:17px}
.ci-ops{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.ci-del{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;transition:color .2s}
.ci-del:hover{color:var(--bad)}
.summary-card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#14141E,#10101A);padding:24px;position:sticky;top:calc(var(--nav-h) + 22px)}
.summary-card h3{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:.08em;margin-bottom:16px}
.sum-line{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;color:var(--muted)}
.sum-line.total{border-top:1px solid var(--line);margin-top:10px;padding-top:16px;color:var(--ink);font-size:16px}
.sum-line.total b{font-family:var(--serif);font-size:24px;color:var(--gold2);font-weight:900}
.empty-state{text-align:center;padding:90px 20px;border:1px dashed var(--line);border-radius:24px;color:var(--muted)}
.empty-state .e-ico{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--gold2)}
.empty-state h3{font-family:var(--serif);color:var(--ink);font-size:20px;margin-bottom:8px}
.empty-state p{font-size:13.5px;margin-bottom:24px}

/* ============ 支付 ============ */
.checkout-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;align-items:start}
.panel{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#13131C,#0F0F17);padding:24px;margin-bottom:18px}
.panel h3{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.06em;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.panel h3 .p-ico{color:var(--gold2);display:flex}
.pay-method{
  display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--line);
  border-radius:14px;margin-bottom:10px;cursor:pointer;transition:all .25s;background:rgba(255,255,255,.02);
}
.pay-method:hover{border-color:var(--line2)}
.pay-method.on{border-color:var(--gold);background:rgba(200,169,106,.08);box-shadow:0 0 0 1px var(--gold) inset}
.pm-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff}
.pm-body{flex:1}
.pm-body b{font-size:14.5px;letter-spacing:.05em;display:block}
.pm-body span{font-size:12px;color:var(--muted)}
.pm-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted2);flex:none;display:grid;place-items:center;transition:all .2s}
.pay-method.on .pm-radio{border-color:var(--gold)}
.pay-method.on .pm-radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.pm-badge{font-size:10.5px;color:var(--gold2);border:1px solid var(--line2);padding:2px 9px;border-radius:999px;letter-spacing:.12em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;letter-spacing:.08em}
.field input{
  width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  padding:0 16px;font-size:14px;outline:none;transition:border-color .25s;
}
.field input:focus{border-color:var(--gold)}
.field input::placeholder{color:var(--muted2)}
.demo-note{font-size:12px;color:var(--warn);margin-top:8px;line-height:1.7}
.address-line{display:flex;gap:12px;align-items:flex-start;font-size:14px;padding:6px 0}
.address-line .a-ico{color:var(--gold2);margin-top:3px;flex:none}
.address-line b{font-family:var(--serif);letter-spacing:.04em}

/* ============ 支付处理遮罩 / 成功页 ============ */
.processing{
  position:fixed;inset:0;z-index:200;background:rgba(8,8,12,.88);backdrop-filter:blur(8px);
  display:grid;place-items:center;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s;
}
.processing.show{opacity:1;pointer-events:auto;visibility:visible}
.pr-box{text-align:center;padding:44px 56px;border:1px solid var(--line2);border-radius:24px;background:linear-gradient(180deg,#14141E,#0E0E16);box-shadow:var(--shadow)}
.spinner{width:52px;height:52px;margin:0 auto 20px;border-radius:50%;border:3px solid rgba(200,169,106,.15);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pr-box b{font-family:var(--serif);font-size:19px;letter-spacing:.1em;display:block;margin-bottom:6px}
.pr-box span{font-size:13px;color:var(--muted)}
.success-hero{text-align:center;padding:56px 24px 48px}
.success-check{width:86px;height:86px;margin:0 auto 22px;border-radius:50%;border:2px solid var(--ok);color:var(--ok);display:grid;place-items:center;box-shadow:0 0 50px rgba(99,199,151,.25);background:radial-gradient(circle at 30% 25%,rgba(99,199,151,.12),transparent 70%)}
.success-hero h1{font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:.1em}
.success-hero p{color:var(--muted);margin-top:10px;font-size:14px}
.success-card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#13131C,#0F0F17);padding:26px;margin:28px auto 30px;max-width:480px}
.sc-line{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;border-bottom:1px dashed rgba(200,169,106,.14)}
.sc-line:last-child{border-bottom:none}
.sc-line span{color:var(--muted)}
.sc-line b{font-family:var(--serif);color:var(--gold2);font-weight:700}
.success-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ============ 钱包 ============ */
.wallet-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start}
.pay-card{border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px;display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,#13131C,#0F0F17)}
.pay-card .pm-ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff}
.pay-card b{font-size:15px;letter-spacing:.05em;display:block}
.pay-card span{font-size:12.5px;color:var(--muted)}
.pay-card .pm-radio{display:none}

/* ============ 订单 ============ */
.order-card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#13131C,#0F0F17);padding:22px;margin-bottom:16px}
.order-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px dashed rgba(200,169,106,.16)}
.order-head .on{font-size:12.5px;color:var(--muted);letter-spacing:.05em}
.status-chip{font-size:11.5px;padding:4px 13px;border-radius:999px;border:1px solid var(--line2);color:var(--gold2);letter-spacing:.14em}
.order-items{display:flex;gap:12px;align-items:center;padding:14px 0}
.order-items img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.order-items b{font-family:var(--serif);font-size:14px;font-weight:700}
.order-items span{font-size:12.5px;color:var(--muted)}
.order-foot{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);padding-top:10px;border-top:1px dashed rgba(200,169,106,.16)}
.order-foot b{font-family:var(--serif);color:var(--gold2);font-size:18px;font-weight:900}

/* ============ 客服聊天 ============ */
.chat-layout{max-width:860px;margin:0 auto}
.chat-panel{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#12121B,#0E0E16);box-shadow:var(--shadow);display:flex;flex-direction:column;height:calc(100vh - var(--nav-h) - 140px);min-height:460px}
.chat-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;background:rgba(200,169,106,.05)}
.chat-avatar{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2A2A3A,#15151F);border:1px solid var(--line2);display:grid;place-items:center;color:var(--gold2);flex:none}
.chat-head b{font-family:var(--serif);font-size:16.5px;letter-spacing:.06em;display:block}
.chat-head span{font-size:12px;color:var(--muted)}
.online-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;box-shadow:0 0 8px rgba(99,199,151,.7)}
.chat-body{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:82%;animation:fadeUp .3s ease}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .m-ava{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--gold2);background:#191926;border:1px solid var(--line2)}
.msg .m-box{border-radius:16px;padding:12px 16px;font-size:14px;line-height:1.7;position:relative}
.msg.bot .m-box{background:#191926;border:1px solid var(--line);border-top-left-radius:4px}
.msg.user .m-box{background:linear-gradient(135deg,#1F2A1E,#15201A);border:1px solid rgba(99,199,151,.25);border-top-right-radius:4px;color:#D9EEDF}
.msg .m-time{font-size:10.5px;color:var(--muted2);margin-top:5px;text-align:right}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 12px}
.chip-sm{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--gold2);transition:all .2s}
.chip-sm:hover{background:rgba(200,169,106,.12)}
.chat-input{display:flex;gap:10px;padding:14px 24px 18px;border-top:1px solid var(--line)}
.chat-input input{
  flex:1;height:48px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  padding:0 20px;font-size:14px;outline:none;
}
.chat-input input:focus{border-color:var(--gold)}
.chat-input .send-btn{width:48px;height:48px;flex:none;border-radius:50%;background:linear-gradient(135deg,#E0BE77,#B8914A);color:#14100A;display:grid;place-items:center;transition:filter .2s}
.chat-input .send-btn:hover{filter:brightness(1.1)}
.chat-fab{
  position:fixed;right:26px;bottom:calc(var(--filing-h) + 26px);z-index:90;width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,#E0BE77,#B8914A);color:#14100A;display:grid;place-items:center;
  box-shadow:0 14px 34px rgba(200,169,106,.35);transition:transform .25s;border:2px solid rgba(255,255,255,.25);
}
.chat-fab:hover{transform:translateY(-3px) scale(1.04)}

/* ============ 个人中心 ============ */
.profile-head{display:flex;align-items:center;gap:20px;border:1px solid var(--line);border-radius:24px;padding:30px;background:radial-gradient(500px 220px at 20% 0%, rgba(200,169,106,.10), transparent 60%),linear-gradient(180deg,#13131C,#0F0F17)}
.avatar{width:76px;height:76px;border-radius:50%;border:1px solid var(--line2);background:radial-gradient(circle at 30% 25%,#2A2A3A,#14141E);display:grid;place-items:center;flex:none;box-shadow:0 0 40px rgba(200,169,106,.15)}
.avatar span{font-family:var(--serif);font-weight:900;font-size:28px;color:var(--gold2)}
.profile-head b{font-family:var(--serif);font-size:22px;letter-spacing:.06em}
.profile-head p{color:var(--muted);font-size:13px;margin-top:6px}
.profile-head .vip-tag{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--gold2);border:1px solid var(--line2);padding:4px 12px;border-radius:999px;letter-spacing:.2em}
.menu-list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:20px;background:linear-gradient(180deg,#13131C,#0F0F17)}
.menu-item{display:flex;align-items:center;gap:16px;padding:18px 22px;cursor:pointer;transition:background .2s;border-bottom:1px solid rgba(200,169,106,.10)}
.menu-item:last-child{border-bottom:none}
.menu-item:hover{background:rgba(200,169,106,.06)}
.menu-item .m-ico{color:var(--gold2);display:flex;flex:none}
.menu-item b{font-size:14.5px;font-weight:500;flex:1;letter-spacing:.04em}
.menu-item .m-note{color:var(--muted);font-size:12px}
.menu-item .m-arrow{color:var(--muted2);display:flex}

/* ============ 底部黑条（随机备案信息） ============ */
.filing-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:150;height:var(--filing-h);
  background:#000;border-top:1px solid rgba(200,169,106,.22);
  display:flex;align-items:center;justify-content:center;gap:14px;overflow:hidden;
}
.filing-inner{display:flex;align-items:center;gap:14px;max-width:1200px;width:100%;padding:0 20px;justify-content:center;flex-wrap:wrap}
.filing-text{
  font-size:11px;color:#8E8E98;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  animation:fadeUp .4s ease;
}
.filing-dot{width:4px;height:4px;border-radius:50%;background:var(--gold3);flex:none}
.filing-bar .f-brand{font-family:var(--serif);font-weight:700;font-size:11.5px;color:#B9A87C;letter-spacing:.2em;white-space:nowrap}

/* ============ 移动端底栏 ============ */
.tabbar{
  display:none;position:fixed;left:0;right:0;bottom:var(--filing-h);z-index:140;height:var(--tab-h);
  background:rgba(10,10,15,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
}
.tabbar-inner{display:grid;grid-template-columns:repeat(4,1fr);height:100%}
.tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;letter-spacing:.1em;position:relative;transition:color .2s}
.tab-item.on{color:var(--gold2)}
.tab-item .badge{
  position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:linear-gradient(135deg,#E0BE77,#B8914A);color:#131013;font-size:10px;font-weight:700;display:grid;place-items:center;
}

/* ============ 通用组件 ============ */
.toast-wrap{position:fixed;top:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{
  background:rgba(20,20,28,.94);border:1px solid var(--line2);color:var(--ink);padding:11px 22px;border-radius:999px;
  font-size:13.5px;box-shadow:var(--shadow);animation:fadeUp .3s ease;display:flex;align-items:center;gap:8px;
}
.toast .t-ico{color:var(--gold2);display:flex}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;margin-bottom:18px;transition:color .2s}
.back-link:hover{color:var(--gold2)}
.section-gap{height:34px}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, ok){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = (ok===false?'':'<span class="t-ico">'+(ok===false?'':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4.5 4.5L19 7"/></svg>')+'</span>') + esc(msg);

}

/* ---------- 购物车 ---------- */
function cartCount(){ return state.cart.reduce((s,it)=>s+it.qty,0); }
function cartFind(id){ return state.cart.find(it=>it.id===id); }
function addToCart(id, qty){
  const it = cartFind(id);
  if(it){ it.qty += (qty||1); } else { state.cart.push({id:id, qty:(qty||1)}); }
  saveState(); updateBadges(); toast('已加入购物车');
}
function setQty(id, delta){
  const it = cartFind(id); if(!it) return;
  it.qty += delta;
  if(it.qty<=0){ state.cart = state.cart.filter(x=>x.id!==id); }
  saveState(); updateBadges(); render();
}
function removeItem(id){ state.cart = state.cart.filter(x=>x.id!==id); saveState(); updateBadges(); render(); toast('已移除该商品'); }
function cartTotal(){ return state.cart.reduce((s,it)=>{ const p=PRODUCTS.find(x=>x.id===it.id); return s + (p?p.price*it.qty:0); },0); }
function updateBadges(){
  const n = cartCount();
  const top = $('cartBadgeTop');
  if(top){ top.textContent = n; top.classList.toggle('hidden', n===0); }
  const tb = $('tabCartBadge');
  if(tb){ tb.textContent = n; tb.classList.toggle('hidden', n===0); }
}

/* ---------- 路由 ---------- */
const VIEWS = ['home','detail','cart','checkout','success','wallet','orders','service','profile'];
function parseRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  if(!h) return {name:'home'};
  const seg = h.split('/');
  if(seg[0]==='product') return {name:'detail', id:seg[1]};
  if(seg[0]==='success') return {name:'success', orderNo:seg[1]};
  if(VIEWS.indexOf(seg[0])>=0) return {name:seg[0]};
  return {name:'home'};
}
let route = {name:'home'};
function render(){
  const r = parseRoute(); route = r;
  VIEWS.forEach(v=>{ const el = $('view-'+v); if(el) el.classList.toggle('active', v===r.name); });
  const main = $('app');
  switch(r.name){
    case 'home': renderHome(); break;
    case 'detail': renderDetail(r.id); break;
    case 'cart': renderCart(); break;
    case 'checkout': renderCheckout(); break;
    case 'success': renderSuccess(r.orderNo); break;
    case 'wallet': renderWallet(); break;
    case 'orders': renderOrders(); break;
    case 'service': renderService(); break;
    case 'profile': renderProfile(); break;
  }
  setActiveNav(r.name);
  updateBadges();
  scrollTop();
}
function setActiveNav(name){
  document.querySelectorAll('#navLinks a').forEach(a=>a.classList.toggle('active', a.dataset.route===name || (name==='detail'&&a.dataset.route==='home')));
  document.querySelectorAll('#tabbar .tab-item').forEach(t=>t.classList.toggle('on', t.dataset.tab===name));
  const fab = $('chatFab');
  if(fab) fab.classList.toggle('hidden', name==='service');
}

function saveCard(){
  const no = $('cfNo').value.replace(/\s+/g,'');
  const holder = $('cfHolder').value.trim();
  const exp = $('cfExp').value.trim();
  const cvv = $('cfCvv').value.trim();
  if(!/^\d{13,19}$/.test(no)){ toast('请输入 13–19 位银行卡号', false); return; }
  if(!holder){ toast('请填写持卡人姓名', false); return; }
  if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(exp)){ toast('有效期格式应为 MM/YY', false); return; }
  if(!/^\d{3,4}$/.test(cvv)){ toast('请输入 3–4 位安全码', false); return; }
  const last4 = no.slice(-4);
  if(state.payments.find(p=>p.type==='card'&&p.last4===last4)){ toast('该卡已绑定', false); return; }
  state.payments.unshift({type:'card', label:'银行卡', bank:'AURUM 合作银行', last4:last4, holder:holder, expiry:exp});
  saveState(); payChoice = 'card:'+last4;

function submitOrder(){
  const m = payMethods();
  const chosen = state.payments.find(p=>(p.type==='card'?('card:'+p.last4):p.type)===payChoice);
  if(!chosen){ toast('请先选择支付方式', false); return; }
  if(state.cart.length===0){ toast('购物车为空', false); return; }
  const overlay = $('processing');
  overlay.classList.add('show');
  const items = state.cart.map(it=>{ const p=PRODUCTS.find(x=>x.id===it.id); return {id:p.id, name:p.name, img:p.img, price:p.price, qty:it.qty}; });
  const total = cartTotal();
  setTimeout(()=>{
    const no = 'AU' + Date.now().toString().slice(-8) + Math.floor(100+Math.random()*900);
    const methodLabel = chosen.type==='card' ? ('银行卡 · 尾号 '+chosen.last4) : chosen.label;
    state.orders.unshift({no:no, time:Date.now(), items:items, total:total, method:methodLabel, status:'待发货'});
    state.cart = [];
    saveState();
    overlay.classList.remove('show');

}

  const btn = document.querySelector('#view-profile .menu-item:last-child b');
  if(!btn || btn.dataset.arm!=='1'){
    document.querySelectorAll('#view-profile .menu-item').forEach((m,i)=>{ if(i===5){ m.querySelector('b').dataset.arm='1'; m.querySelector('b').textContent='再次点击确认清除'; m.style.background='rgba(201,100,100,.08)'; setTimeout(()=>{ delete m.querySelector('b').dataset.arm; m.querySelector('b').textContent='清除演示数据'; m.style.background=''; },2600); } });
    return;
  }
  localStorage.removeItem(LS_KEY);
  state = defaultState();
  saveState();
  toast('演示数据已重置');
  render();
}

/* ---------- 移动端底栏 ---------- */
function renderTabbar(){
  const tb = $('tabbar');
  const tabs = [
    {key:'home', label:'首页', icon:I.home},
    {key:'cart', label:'购物车', icon:I.cart},
    {key:'service', label:'客服', icon:I.headset},
    {key:'profile', label:'我的', icon:I.user},
  ];
  tb.innerHTML = tabs.map(t=>
    '<div class="tab-item" data-tab="'+t.key+'" onclick="go(\'#/'+(t.key==='profile'?'profile':t.key==='cart'?'cart':t.key==='service'?'service':'home')+'\')">' +
      '<span>'+(t.key==='cart'?'<span class="badge hidden" id="tabCartBadge">0</span>':'')+t.icon+'</span>' +
      t.label +
    '</div>').join('');
}

/* ---------- 初始化 ---------- */
function initNavCats(){
  document.querySelectorAll('#navLinks a[data-cat]').forEach(a=>{
    a.addEventListener('click', ()=>{ homeCat = a.dataset.cat; if($('view-home').classList.contains('active')) renderHome(); });
  });
}
function init(){
  render();
  initSearch();
  initNavCats();
  renderTabbar();
  updateBadges();
  renderFiling();
  setInterval(renderFiling, 8000);
}
init();
